name: Build Python distributions and publish Docker image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - uses: astral-sh/setup-uv@v6
      - name: Build and verify Python distributions
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/krun-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/krun-bin
        run: |
          uv build
          uv tool install --from dist/krun_cli-*-py3-none-any.whl krun-cli
          "$UV_TOOL_DIR/krun-cli/bin/python" scripts/check_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify before publishing
        run: |
          ./bin/krun demo sales-report --dry-run
          ./bin/krun demo module --dry-run
          ./bin/krun demo notebook --dry-run
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          provenance: true
          sbom: true
