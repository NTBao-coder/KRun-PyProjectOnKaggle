name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q krun tests
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel, then test the installed tool
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/krun-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/krun-bin
        run: |
          uv build
          uv tool install --python '${{ matrix.python }}' --from dist/krun_cli-*-py3-none-any.whl krun-cli
          if [ '${{ runner.os }}' = Windows ]; then
            "$UV_TOOL_DIR/krun-cli/Scripts/python.exe" scripts/check_installed.py
          else
            "$UV_TOOL_DIR/krun-cli/bin/python" scripts/check_installed.py
          fi
      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/krun.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash -n bin/krun scripts/install.sh
      - run: ./bin/krun demo sales-report --dry-run
      - run: ./bin/krun demo module --dry-run
      - run: ./bin/krun demo notebook --dry-run
