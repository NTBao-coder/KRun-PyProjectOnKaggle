[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krun-cli"
version = "0.2.1"
description = "Make Kaggle GPU feel like a local Python runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "krun contributors" }]
dependencies = [
    "kaggle>=2.2,<3",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
krun = "krun.cli:run_cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[project.urls]
Homepage = "https://github.com/nhminh107/KRun-PyProjectOnKaggle"
Issues = "https://github.com/nhminh107/KRun-PyProjectOnKaggle/issues"

[tool.setuptools]
packages = ["krun"]
include-package-data = false

[tool.setuptools.package-data]
krun = [
    "demo_templates/sales_report/main.py",
    "demo_templates/sales_report/reporting/*.py",
    "demo_templates/sales_report/krun.yaml",
    "demo_templates/sales_report/data/orders.csv",
    "demo_templates/module_job/report_job/*.py",
    "demo_templates/notebook_job/report.ipynb",
    "demo_templates/*/README.md",
    "demo_templates/*/.gitignore",
    "demo_templates/*/.krunignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
