[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krun-cli"
version = "0.1.0"
description = "Make Kaggle GPU feel like a local Python runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "krun contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
krun = "krun.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["krun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

